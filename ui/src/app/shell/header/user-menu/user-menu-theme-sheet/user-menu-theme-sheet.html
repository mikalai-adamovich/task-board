<hlm-sheet [state]="open()" (stateChanged)="open.set($event)" side="bottom" [autoFocus]="initialFocusSelector">
  <button
    hlmSheetTrigger
    side="bottom"
    class="hidden"
    [attr.aria-label]="'userMenu.openThemePicker' | transloco"
  ></button>
  <hlm-sheet-content
    *hlmSheetPortal="let ctx"
    side="bottom"
    class="gap-0"
    role="dialog"
    [attr.aria-label]="'userMenu.chooseTheme' | transloco"
  >
    <hlm-sheet-header class="grid grid-cols-[1fr_auto_1fr] items-center gap-2 p-3">
      <!-- a11y: the vendored HlmSheetTitle is the ATTRIBUTE directive `[hlmSheetTitle]`
           (ui/libs/ui/sheet/src/lib/hlm-sheet-title.ts) — there is no `<hlm-sheet-title>`
           element. It host-directives BrnDialogTitle, which stamps the id the CDK
           container points `aria-labelledby` at; the dash-case spelling left that id
           unset, so the sheet had a dangling aria-labelledby and no accessible name. -->
      <h3 hlmSheetTitle class="text-lg font-semibold text-foreground justify-self-start">
        {{ 'userMenu.themes' | transloco }}
      </h3>
      <ui-theme-mode-switch (navigateDown)="focusThemeGrid()" />
      <span></span>
    </hlm-sheet-header>
    <div
      #themeGrid
      class="grid gap-y-4 gap-x-6 py-3 px-6 max-h-89 overflow-y-auto outline-none"
      [style.grid-template-columns]="'repeat(auto-fill, minmax(' + minColumnWidth + ', 1fr))'"
      role="listbox"
      [attr.aria-label]="'userMenu.availableThemes' | transloco"
      tabindex="0"
      (keydown)="onThemeKeydown($event)"
      (focusout)="onGridFocusout($event)"
    >
      @for (theme of visibleThemes(); track theme.id) {
        <button
          hlmBtn
          variant="outline"
          class="flex flex-col items-center justify-center gap-1.5 h-40 w-46 p-2 bg-transparent hover:bg-transparent border-0 focus-visible:ring-0 focus-visible:border-transparent"
          (click)="selectTheme(theme.id)"
          (focus)="onThemeFocus(theme.id)"
          [attr.data-theme]="theme.id"
          role="option"
          [attr.aria-selected]="getHighlightedTheme() === theme.id"
        >
          <div
            class="flex h-34 w-46 flex-col rounded-lg border"
            [class.ring-2]="getHighlightedTheme() === theme.id"
            [class.ring-primary]="getHighlightedTheme() === theme.id"
            [style.background-color]="theme.preview.card"
            [style.border-color]="theme.preview.border"
          >
            <!-- Header -->
            <div
              class="flex justify-between h-6 items-center border-b rounded-t-lg px-2 grow"
              [style.background-color]="theme.preview.card"
              [style.border-color]="theme.preview.border"
            >
              <div
                class="h-2 w-5 rounded-full"
                [style.background-color]="theme.preview.foreground"
                [style.opacity]="'0.8'"
              ></div>
              <div class="flex gap-1">
                <div
                  class="h-1.5 w-1.5 rounded-full"
                  [style.background-color]="theme.preview.foreground"
                  [style.opacity]="'0.3'"
                ></div>
                <div
                  class="h-1.5 w-1.5 rounded-full"
                  [style.background-color]="theme.preview.foreground"
                  [style.opacity]="'0.3'"
                ></div>
                <div
                  class="h-1.5 w-1.5 rounded-full"
                  [style.background-color]="theme.preview.foreground"
                  [style.opacity]="'0.3'"
                ></div>
              </div>
            </div>
            <!-- Content -->
            <div class="flex h-28">
              <!-- Sidebar -->
              <div
                class="w-10 border-r rounded-bl-lg p-1 py-2"
                [style.background-color]="theme.preview.card"
                [style.border-color]="theme.preview.border"
              >
                <div class="mb-2 h-1.5 w-full rounded" [style.background-color]="theme.preview.muted"></div>
                <div class="mb-2 h-1.5 w-full rounded" [style.background-color]="theme.preview.muted"></div>
                <div class="mb-2 h-1.5 w-full rounded" [style.background-color]="theme.preview.muted"></div>
                <div class="mb-2 h-1.5 w-full rounded" [style.background-color]="theme.preview.muted"></div>
                <div class="mb-2 h-1.5 w-full rounded" [style.background-color]="theme.preview.muted"></div>
              </div>
              <div class="flex p-5 grow">
                <!-- Card -->
                <div
                  class="rounded border p-2 justify-center grow"
                  [style.background-color]="theme.preview.card"
                  [style.border-color]="theme.preview.border"
                >
                  <div
                    class="mb-3 h-2 w-6 rounded"
                    [style.background-color]="theme.preview.foreground"
                    [style.opacity]="'0.8'"
                  ></div>
                  <div class="mb-2 h-1.5 w-full rounded" [style.background-color]="theme.preview.muted"></div>
                  <div class="mb-2 h-1.5 w-4/5 rounded" [style.background-color]="theme.preview.muted"></div>
                  <div
                    class="h-3 w-16 rounded-md"
                    [style.background-color]="theme.preview.primary"
                    [style.opacity]="'0.9'"
                  ></div>
                </div>
              </div>
            </div>
          </div>
          <div class="flex items-center justify-center gap-1 leading-tight">
            <span class="font-medium text-center" [class.theme-name-selected]="isSelected(theme.id)">{{
              theme.name
            }}</span>
            @if (isSelected(theme.id)) {
              <ng-icon name="lucideCheck" class="font-semibold" aria-hidden="true" />
            }
          </div>
        </button>
      }
    </div>
  </hlm-sheet-content>
</hlm-sheet>
