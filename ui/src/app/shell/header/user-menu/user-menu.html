<!-- data-testid: the avatar button and the sign-out item are the only E2E handles in
     this menu (F13) — the whole menu is transloco-driven, so an E2E selector could
     otherwise only be an English UI string. Nothing else in the app selects on them. -->
<button
  hlmBtn
  variant="ghost"
  class="flex items-center gap-2 px-2"
  aria-haspopup="menu"
  data-testid="user-menu-trigger"
  [hlmDropdownMenuTrigger]="userMenu"
  (hlmDropdownMenuOpened)="onMenuOpened()"
  (hlmDropdownMenuClosed)="onMenuClosed()"
  [attr.aria-label]="'header.userMenu' | transloco"
>
  <hlm-avatar class="border-2" [style.border-color]="roleColor()" role="img">
    <span hlmAvatarFallback>{{ initials() }}</span>
  </hlm-avatar>
  <span class="hidden text-sm font-medium md:inline" [style.color]="roleColor()">
    {{ user()?.displayName }}
  </span>
</button>

<ng-template #userMenu>
  <hlm-dropdown-menu class="w-40">
    <!-- User info -->
    <div class="px-2 py-1.5">
      <p class="text-sm font-medium text-foreground">{{ user()?.email }}</p>
      <p class="text-xs text-muted-foreground">{{ roleLabel() }}</p>
    </div>

    <hlm-dropdown-menu-separator />

    <!-- Zoom controls -->
    <ui-user-menu-zoom-controls />

    <hlm-dropdown-menu-separator />

    <!-- Language switcher -->
    <button hlmDropdownMenuItem [hlmDropdownMenuTrigger]="languageMenu" [disableHoverOpen]="true">
      <ng-icon name="lucideGlobe" />
      <span>{{ 'userMenu.language' | transloco }}</span>
    </button>

    <!-- Themes -->
    <button hlmDropdownMenuItem (click)="themeSheetOpen.set('open')">
      <ng-icon name="lucidePalette" />
      <span>{{ 'userMenu.themes' | transloco }}</span>
    </button>

    <!-- Preferences (V3-7: /profile/preferences) -->
    <a hlmDropdownMenuItem routerLink="/profile/preferences">
      <ng-icon name="lucideSettings" />
      <span>{{ 'userMenu.preferences' | transloco }}</span>
    </a>

    <!-- Sign out -->
    <button hlmDropdownMenuItem variant="destructive" data-testid="user-menu-sign-out" (click)="logout()">
      <ng-icon name="lucideLogOut" />
      <span>{{ 'userMenu.signOut' | transloco }}</span>
    </button>
  </hlm-dropdown-menu>
</ng-template>

<!-- The theme sheet (and its dependency graph: theme-mode-switch → radio-group →
     @angular/forms, plus the sonner toast API) is only needed when the user opens
     it — defer the whole subtree out of the initial bundle. -->
@defer (when themeSheetOpen() === 'open') {
  <ui-user-menu-theme-sheet [(open)]="themeSheetOpen" />
}

<ng-template #languageMenu>
  <ui-language-switcher />
</ng-template>
