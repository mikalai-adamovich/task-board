<!-- Keyboard-operable card — Enter and Space both activate (Space also
     prevents the page scroll that a bare Space keydown would trigger).
     a11y: `v` opens the "move to column" picker — the keyboard path that
     replaces the pointer-only CDK drag. Advertised via `aria-keyshortcuts`
     (assisted tech reads it out) and in the app's shortcut-help dialog. The
     global hotkey service ignores `v` entirely, so there is no conflict. -->
<div
  class="cursor-pointer rounded-md border border-border bg-card p-3 shadow-sm transition-all hover:shadow-md hover:border-primary/30"
  role="button"
  tabindex="0"
  aria-keyshortcuts="v"
  (keydown.enter)="taskClick.emit(task())"
  (keydown.space)="$event.preventDefault(); taskClick.emit(task())"
  (keydown.v)="$event.preventDefault(); moveRequested.emit(task())"
>
  <!-- Top row: task key left, priority right. Middle: title only, clamped to
       2 lines with ellipsis. Bottom: issue type left, assignee right. The card
       renders the lightweight BoardTask projection — no description/metadata. -->
  <div class="flex items-start justify-between gap-2">
    <span class="shrink-0 text-xs font-mono text-muted-foreground">{{ taskLabel() }}</span>
    <span hlmBadge class="ml-auto shrink-0 text-[10px] uppercase" [variant]="priorityVariant()">
      {{ priorityLabel(task().priorityLevel) }}
    </span>
  </div>

  <h3 class="mt-1 line-clamp-2 text-sm font-medium text-foreground" [title]="task().title">{{ task().title }}</h3>

  <div class="mt-2 flex items-center justify-between">
    <!-- Issue type (resolved via the shared reference-data store) -->
    <span class="truncate text-[10px] text-muted-foreground">{{ typeName() }}</span>
    <!-- Single assignee -->
    <div class="flex shrink-0 items-center gap-1">
      @if (task().assigneeSnapshot; as assignee) {
        <hlm-avatar class="size-5 border border-card">
          <div hlmAvatarFallback class="text-[9px] font-medium">
            {{ assigneeInitials() }}
          </div>
        </hlm-avatar>
        <span class="text-[10px] text-muted-foreground">{{ assignee.displayName }}</span>
      } @else {
        <span class="text-[10px] text-muted-foreground italic">{{ 'taskTable.unassigned' | transloco }}</span>
      }
    </div>
  </div>
</div>
