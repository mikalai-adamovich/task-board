<!-- Toolbar (hidden in fallback mode and in read-only mode).

     NO `role="toolbar"` here, deliberately. That role promises a composite
     widget — a single tab stop with arrow-key movement between its controls.
     This container has no key handler and no roving tabindex, so the roughly
     fourteen buttons inside are independently focusable: exactly what a
     `role="group"` describes. Assistive technology is told one thing and given
     another, so the role is removed rather than documented.
     `aria-label` stays: it still names the group. -->
@if (!fallbackMode() && !readOnly()) {
  <div
    class="flex flex-wrap items-center gap-0.5 rounded-t-md border border-b-0 border-border bg-muted/40 px-2 py-1"
    [attr.aria-label]="'milkdownEditor.toolbar' | transloco"
  >
    <!-- Text formatting -->
    <!--
    These four are TOGGLES (the same command turns the mark on and off), so
    each reports its state. `isMarkActive` reads the editor's own selection — a
    constant `aria-pressed="false"` would be a lie, not a fix. The heading buttons
    below are actions, not toggles, and correctly carry no state.
  -->
    <button
      hlmBtn
      variant="ghost"
      size="sm"
      class="h-7 w-7 p-0"
      type="button"
      (click)="runCommand('strong')"
      [hlmTooltip]="'milkdownEditor.bold' | transloco"
      [attr.aria-label]="'milkdownEditor.bold' | transloco"
      [attr.aria-pressed]="isMarkActive('strong')"
      [disabled]="mode() === 'raw'"
    >
      <ng-icon name="lucideBold" />
    </button>
    <button
      hlmBtn
      variant="ghost"
      size="sm"
      class="h-7 w-7 p-0"
      type="button"
      (click)="runCommand('emphasis')"
      [hlmTooltip]="'milkdownEditor.italic' | transloco"
      [attr.aria-label]="'milkdownEditor.italic' | transloco"
      [attr.aria-pressed]="isMarkActive('emphasis')"
      [disabled]="mode() === 'raw'"
    >
      <ng-icon name="lucideItalic" />
    </button>
    <button
      hlmBtn
      variant="ghost"
      size="sm"
      class="h-7 w-7 p-0"
      type="button"
      (click)="runCommand('strikethrough')"
      [hlmTooltip]="'milkdownEditor.strikethrough' | transloco"
      [attr.aria-label]="'milkdownEditor.strikethrough' | transloco"
      [attr.aria-pressed]="isMarkActive('strike_through')"
      [disabled]="mode() === 'raw'"
    >
      <ng-icon name="lucideStrikethrough" />
    </button>
    <button
      hlmBtn
      variant="ghost"
      size="sm"
      class="h-7 w-7 p-0"
      type="button"
      (click)="runCommand('inlineCode')"
      [hlmTooltip]="'milkdownEditor.inlineCode' | transloco"
      [attr.aria-label]="'milkdownEditor.inlineCode' | transloco"
      [attr.aria-pressed]="isMarkActive('inlineCode')"
      [disabled]="mode() === 'raw'"
    >
      <ng-icon name="lucideCode" />
    </button>

    <span class="mx-1 h-4 w-px bg-border"></span>

    <!-- Headings -->
    <button
      hlmBtn
      variant="ghost"
      size="sm"
      class="h-7 w-7 p-0 text-xs font-semibold"
      type="button"
      (click)="runHeading(1)"
      [hlmTooltip]="'Heading 1'"
      [disabled]="mode() === 'raw'"
    >
      H1
    </button>
    <button
      hlmBtn
      variant="ghost"
      size="sm"
      class="h-7 w-7 p-0 text-xs font-semibold"
      type="button"
      (click)="runHeading(2)"
      [hlmTooltip]="'Heading 2'"
      [disabled]="mode() === 'raw'"
    >
      H2
    </button>
    <button
      hlmBtn
      variant="ghost"
      size="sm"
      class="h-7 w-7 p-0 text-xs font-semibold"
      type="button"
      (click)="runHeading(3)"
      [hlmTooltip]="'Heading 3'"
      [disabled]="mode() === 'raw'"
    >
      H3
    </button>

    <span class="mx-1 h-4 w-px bg-border"></span>

    <!-- Lists & blocks -->
    <button
      hlmBtn
      variant="ghost"
      size="sm"
      class="h-7 w-7 p-0"
      type="button"
      (click)="runCommand('bulletList')"
      [hlmTooltip]="'milkdownEditor.bulletList' | transloco"
      [attr.aria-label]="'milkdownEditor.bulletList' | transloco"
      [disabled]="mode() === 'raw'"
    >
      <ng-icon name="lucideList" />
    </button>
    <button
      hlmBtn
      variant="ghost"
      size="sm"
      class="h-7 w-7 p-0"
      type="button"
      (click)="runCommand('orderedList')"
      [hlmTooltip]="'milkdownEditor.orderedList' | transloco"
      [attr.aria-label]="'milkdownEditor.orderedList' | transloco"
      [disabled]="mode() === 'raw'"
    >
      <ng-icon name="lucideListOrdered" />
    </button>
    <button
      hlmBtn
      variant="ghost"
      size="sm"
      class="h-7 w-7 p-0"
      type="button"
      (click)="runCommand('blockquote')"
      [hlmTooltip]="'milkdownEditor.blockquote' | transloco"
      [attr.aria-label]="'milkdownEditor.blockquote' | transloco"
      [disabled]="mode() === 'raw'"
    >
      <ng-icon name="lucideQuote" />
    </button>
    <button
      hlmBtn
      variant="ghost"
      size="sm"
      class="h-7 w-7 p-0"
      type="button"
      (click)="runCommand('codeBlock')"
      [hlmTooltip]="'milkdownEditor.codeBlock' | transloco"
      [attr.aria-label]="'milkdownEditor.codeBlock' | transloco"
      [disabled]="mode() === 'raw'"
    >
      <ng-icon name="lucideFileText" />
    </button>

    <span class="mx-1 h-4 w-px bg-border"></span>

    <!-- Insert -->
    <button
      hlmBtn
      variant="ghost"
      size="sm"
      class="h-7 w-7 p-0"
      type="button"
      (click)="insertLink()"
      [hlmTooltip]="'milkdownEditor.link' | transloco"
      [attr.aria-label]="'milkdownEditor.link' | transloco"
      [disabled]="mode() === 'raw'"
    >
      <ng-icon name="lucideLink" />
    </button>
    <button
      hlmBtn
      variant="ghost"
      size="sm"
      class="h-7 w-7 p-0"
      type="button"
      (click)="runCommand('hr')"
      [hlmTooltip]="'milkdownEditor.horizontalRule' | transloco"
      [attr.aria-label]="'milkdownEditor.horizontalRule' | transloco"
      [disabled]="mode() === 'raw'"
    >
      <ng-icon name="lucideMinus" />
    </button>

    <!-- WYSIWYG ⇄ raw markdown toggle -->
    <span class="mx-1 h-4 w-px bg-border"></span>
    <button
      hlmBtn
      variant="outline"
      size="sm"
      class="h-7 gap-1 px-2 text-xs"
      type="button"
      (click)="toggleMode()"
      [hlmTooltip]="
        mode() === 'wysiwyg' ? ('milkdownEditor.showRaw' | transloco) : ('milkdownEditor.showWysiwyg' | transloco)
      "
    >
      @if (mode() === 'wysiwyg') {
        <ng-icon name="lucideEye" /> {{ 'milkdownEditor.raw' | transloco }}
      } @else {
        <ng-icon name="lucideFileText" /> {{ 'milkdownEditor.wysiwyg' | transloco }}
      }
    </button>
  </div>
}

<!-- Raw markdown textarea (also the automatic fallback) -->
@if (fallbackMode() || mode() === 'raw') {
  <textarea
    hlmTextarea
    class="min-h-50 w-full rounded-t-none font-mono text-sm"
    [attr.aria-label]="'milkdownEditor.raw' | transloco"
    [value]="fallbackContent()"
    (input)="onRawInput($event)"
    [placeholder]="'milkdownEditor.rawPlaceholder' | transloco"
  ></textarea>
}

<!-- Milkdown WYSIWYG host — always rendered so initMilkdown() can find it -->
<div
  class="milkdown-host min-h-50 w-full max-w-none rounded-t-none border border-border bg-card p-4 prose prose-sm dark:prose-invert"
  [class.hidden]="fallbackMode() || mode() === 'raw'"
></div>
